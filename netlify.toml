[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-Page Application (SPA) client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & caching headers for production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
